<div class="page-head">
    <div>
        <h2 class="page-title">公告管理</h2>
        <p class="page-desc">草稿可编辑，发布后员工端才能看到，撤回后重新变回草稿状态</p>
    </div>
    <div class="toolbar">
        <input type="text" id="noticeKeyword" placeholder="搜索标题或内容…"
               style="width:200px;padding:8px 10px;border:1px solid #e5e7eb;border-radius:8px;">
        <button class="btn btn-ghost" onclick="searchNotices()">搜索</button>
        <button class="btn" onclick="showNoticeModal()">新建公告</button>
    </div>
</div>

<div class="card">
    <div class="card-head">
        <h3 class="card-title">公告列表</h3>
        <span class="hint" id="noticeHint">共 0 条</span>
    </div>
    <div class="table-wrap">
        <table class="table">
            <thead>
                <tr>
                    <th style="width:60px;">#</th>
                    <th>标题</th>
                    <th>内容摘要</th>
                    <th>发布人</th>
                    <th>状态</th>
                    <th>发布时间</th>
                    <th>创建时间</th>
                    <th style="width:190px;">操作</th>
                </tr>
            </thead>
            <tbody id="noticeTableBody">
                <tr class="empty-row"><td colspan="8">正在加载…</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div class="modal-mask" id="noticeModal" hidden>
    <div class="modal-panel">
        <div class="modal-head">
            <span id="noticeModalTitle">新建公告</span>
            <button class="modal-close" onclick="hideNoticeModal()">×</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="noticeId">
            <div class="field">
                <label for="noticeTitle">标题</label>
                <input type="text" id="noticeTitle" placeholder="例如：关于 10 月社保基数调整的通知">
            </div>
            <div class="field">
                <label for="noticeContent">内容</label>
                <textarea id="noticeContent" rows="7" placeholder="公告正文…"></textarea>
            </div>
        </div>
        <div class="modal-foot">
            <button class="btn btn-ghost" onclick="hideNoticeModal()">取消</button>
            <button class="btn" onclick="saveNotice()">保存草稿</button>
        </div>
    </div>
</div>
