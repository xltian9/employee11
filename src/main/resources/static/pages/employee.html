<div class="page-head">
    <div>
        <h2 class="page-title">员工管理</h2>
        <p class="page-desc">花名册、职级与月薪，月薪直接参与工资报告计算</p>
    </div>
    <div class="toolbar">
        <button class="btn btn-primary" onclick="showAddEmployeeModal()">新增员工</button>
    </div>
</div>

<div class="card">
    <div class="card-head">
        <div class="toolbar">
            <input type="text" id="searchInput" placeholder="姓名 / 工号"
                   style="width:180px;padding:8px 10px;border:1px solid #e5e7eb;border-radius:8px;">
            <select id="departmentFilter" style="width:150px;padding:8px 10px;border:1px solid #e5e7eb;border-radius:8px;">
                <option value="">全部部门</option>
            </select>
            <select id="statusFilter" style="width:130px;padding:8px 10px;border:1px solid #e5e7eb;border-radius:8px;">
                <option value="">全部状态</option>
                <option value="true">在职</option>
                <option value="false">离职</option>
            </select>
            <button class="btn btn-ghost" onclick="filterEmployees()">查询</button>
            <button class="btn btn-ghost" onclick="resetEmployeeFilter()">重置</button>
        </div>
        <span class="hint" id="employeeSummary"></span>
    </div>
    <div class="table-wrap">
        <table class="table">
            <thead>
                <tr>
                    <th style="width:56px;">照片</th>
                    <th>工号</th>
                    <th>姓名</th>
                    <th>部门</th>
                    <th>职位</th>
                    <th>手机号</th>
                    <th>邮箱</th>
                    <th class="num">月薪</th>
                    <th>入职日期</th>
                    <th class="center">状态</th>
                    <th style="width:150px;">操作</th>
                </tr>
            </thead>
            <tbody id="employeeTableBody">
                <tr class="empty-row"><td colspan="11">正在加载…</td></tr>
            </tbody>
        </table>
    </div>
    <div class="pager" id="employeePager"></div>
</div>

<div class="modal-mask" id="employeeModal" hidden>
    <div class="modal-panel wide">
        <div class="modal-head">
            <span id="employeeModalTitle">新增员工</span>
            <button class="modal-close" onclick="hideEmployeeModal()">×</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="employeeId">
            <div class="field-row">
                <div class="field">
                    <label for="employeeName">姓名</label>
                    <input type="text" id="employeeName" maxlength="50">
                </div>
                <div class="field">
                    <label for="employeeNumber">工号（留空自动生成）</label>
                    <input type="text" id="employeeNumber" maxlength="50" placeholder="EMP2400001">
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="employeeDepartment">部门</label>
                    <select id="employeeDepartment"></select>
                </div>
                <div class="field">
                    <label for="employeePosition">职位</label>
                    <input type="text" id="employeePosition" maxlength="50">
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="employeePhone">手机号（也是初始密码）</label>
                    <input type="text" id="employeePhone" maxlength="20">
                </div>
                <div class="field">
                    <label for="employeeEmail">邮箱</label>
                    <input type="text" id="employeeEmail" maxlength="100">
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="employeeWage">月薪（元）</label>
                    <input type="number" id="employeeWage" min="0" step="0.01">
                </div>
                <div class="field">
                    <label for="employeeEntryDate">入职日期</label>
                    <input type="date" id="employeeEntryDate">
                </div>
                <div class="field">
                    <label for="employeeStatus">状态</label>
                    <select id="employeeStatus">
                        <option value="true">在职</option>
                        <option value="false">离职</option>
                    </select>
                </div>
            </div>
            <div class="field">
                <label>照片</label>
                <div class="toolbar">
                    <img id="employeePhotoPreview" alt="照片"
                         style="width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid #e5e7eb;background:#f8fafc;">
                    <input type="file" id="employeePhotoFile" accept="image/*" style="padding:6px;">
                    <button class="btn btn-ghost btn-sm" onclick="uploadEmployeePhoto()">上传照片</button>
                </div>
                <span class="hint">支持 jpg/jpeg/png/gif/bmp，单张不超过 5MB；先保存员工再上传照片。</span>
            </div>
        </div>
        <div class="modal-foot">
            <button class="btn btn-ghost" onclick="hideEmployeeModal()">取消</button>
            <button class="btn btn-primary" onclick="saveEmployee()">保存</button>
        </div>
    </div>
</div>
