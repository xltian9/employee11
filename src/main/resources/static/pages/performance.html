<div class="container">
    <h2 class="mb-4">业绩管理</h2>
    <button class="btn btn-primary mb-3" onclick="showCreateModal()">新建业绩</button>
    <table id="performanceTable" class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>员工 ID</th>
                <th>年份</th>
                <th>季度</th>
                <th>评分</th>
                <th>评价</th>
                <th>状态</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="performanceBody">
            <!-- 数据将通过 JavaScript 动态填充 -->
        </tbody>
    </table>

    <!-- 新建/编辑模态框 -->
    <div id="performanceModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">新建业绩</h2>
            <form id="performanceForm" class="row g-3">
                <input type="hidden" id="performanceId">
                <div class="col-md-6">
                    <label for="employeeId" class="form-label">员工 ID:</label>
                    <input type="number" id="employeeId" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label for="year" class="form-label">年份:</label>
                    <input type="number" id="year" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label for="quarter" class="form-label">季度:</label>
                    <input type="number" id="quarter" class="form-control" min="1" max="4" required>
                </div>
                <div class="col-md-6">
                    <label for="score" class="form-label">评分:</label>
                    <input type="number" id="score" class="form-control" step="0.1" required>
                </div>
                <div class="col-md-12">
                    <label for="evaluation" class="form-label">评价:</label>
                    <textarea id="evaluation" class="form-control" required></textarea>
                </div>
                <div class="col-md-12">
                    <label for="status" class="form-label">状态:</label>
                    <select id="status" class="form-select">
                        <option value="0">待确认</option>
                        <option value="1">已确认</option>
                    </select>
                </div>
                <div class="col-md-12">
                    <button type="button" class="btn btn-primary" onclick="savePerformance()">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>

    <!-- 引入 Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/performance.js"></script>
</body>
</html>
