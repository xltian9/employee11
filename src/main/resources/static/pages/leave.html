<div class="page-head">
    <div>
        <h2 class="page-title">请假管理</h2>
        <p class="page-desc">审批结果会实时影响考勤统计与工资扣款，撤销后自动回滚</p>
    </div>
    <div class="toolbar">
        <select id="leaveStatusFilter"
                style="width:120px;padding:8px 10px;border:1px solid #e5e7eb;border-radius:8px;">
            <option value="">全部状态</option>
        </select>
        <button class="btn btn-ghost" onclick="loadLeaves()">查询</button>
    </div>
</div>

<div class="stat-grid">
    <div class="stat">
        <div class="stat-label">待审批</div>
        <div class="stat-value" id="statLeavePending">-</div>
        <div class="stat-foot">需要尽快处理</div>
    </div>
    <div class="stat">
        <div class="stat-label">已通过</div>
        <div class="stat-value" id="statLeaveApproved">-</div>
        <div class="stat-foot">已计入工资扣款</div>
    </div>
    <div class="stat">
        <div class="stat-label">已拒绝 / 已撤销</div>
        <div class="stat-value" id="statLeaveClosed">-</div>
        <div class="stat-foot">不参与工资计算</div>
    </div>
    <div class="stat">
        <div class="stat-label">本月请假天数</div>
        <div class="stat-value" id="statLeaveDays">-</div>
        <div class="stat-foot">按开始时间所在月份统计</div>
    </div>
</div>

<div class="card">
    <div class="card-head">
        <h3 class="card-title">请假记录</h3>
        <span class="hint">“通过 / 拒绝”仅对“待审批”记录可用；撤销对本人或管理员开放</span>
    </div>
    <div class="table-wrap">
        <table class="table">
            <thead>
                <tr>
                    <th>员工</th>
                    <th>类型</th>
                    <th>开始时间</th>
                    <th>结束时间</th>
                    <th class="num">天数</th>
                    <th>原因</th>
                    <th>状态</th>
                    <th>审批人 / 意见</th>
                    <th style="width:150px;">操作</th>
                </tr>
            </thead>
            <tbody id="leaveTableBody">
                <tr class="empty-row"><td colspan="9">正在加载…</td></tr>
            </tbody>
        </table>
    </div>
</div>
