<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工管理系统 · 登录</title>
    <link href="/css/app.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(1200px 600px at 20% 0%, #e8efff 0%, #f5f6fa 55%, #f5f6fa 100%);
        }

        .login-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }

        .login-card {
            width: 100%;
            max-width: 880px;
            display: grid;
            grid-template-columns: 1.05fr .95fr;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: 0 18px 48px rgba(15, 23, 42, .10);
            overflow: hidden;
        }

        .login-aside {
            padding: 40px 36px;
            background: linear-gradient(160deg, #1e293b 0%, #0f172a 100%);
            color: #cbd5e1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .login-aside h1 {
            color: #fff;
            font-size: 22px;
            margin: 22px 0 10px;
            letter-spacing: .5px;
        }

        .login-aside p {
            font-size: 13px;
            line-height: 1.9;
            color: #94a3b8;
            margin: 0;
        }

        .login-aside ul {
            margin: 18px 0 0;
            padding-left: 18px;
            font-size: 13px;
            line-height: 2;
            color: #94a3b8;
        }

        .login-aside .brand-mark {
            width: 42px;
            height: 42px;
            font-size: 15px;
        }

        .login-form {
            padding: 40px 36px;
        }

        .login-form h2 {
            margin: 0 0 6px;
            font-size: 20px;
        }

        .login-form .sub {
            margin: 0 0 22px;
            color: var(--ink-soft);
            font-size: 13px;
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            padding: 4px;
            background: #f1f5f9;
            border-radius: 10px;
            margin-bottom: 22px;
        }

        .tab {
            padding: 9px 10px;
            text-align: center;
            border-radius: 8px;
            font-size: 13.5px;
            color: #475569;
            cursor: pointer;
            border: none;
            background: none;
            transition: background .16s ease, color .16s ease, box-shadow .16s ease;
        }

        .tab.active {
            background: #fff;
            color: var(--brand-dark);
            font-weight: 600;
            box-shadow: var(--shadow-sm);
        }

        .login-submit {
            width: 100%;
            justify-content: center;
            padding: 11px 14px;
            margin-top: 6px;
        }

        @media (max-width: 760px) {
            .login-card {
                grid-template-columns: 1fr;
            }

            .login-aside {
                display: none;
            }
        }
    </style>
</head>
<body>
<div class="login-shell">
    <div class="login-card">
        <aside class="login-aside">
            <div>
                <div class="brand-mark">EP</div>
                <h1>员工管理系统</h1>
                <p>考勤 · 请假 · 绩效 · 工资，一体化管理<br>所有敏感操作均留有审计日志</p>
                <ul>
                    <li>管理员：维护员工、审批请假、核算工资</li>
                    <li>员工：打卡、请假、查看绩效与本人工资</li>
                </ul>
            </div>
            <p style="margin-top:28px;font-size:12px;">© 2026 Employee Platform</p>
        </aside>

        <section class="login-form">
            <h2 id="formTitle">员工登录</h2>
            <p class="sub">请使用姓名（或工号）与密码登录</p>

            <div class="tabs">
                <button type="button" class="tab active" id="tabEmployee" onclick="switchType('employee')">员工登录</button>
                <button type="button" class="tab" id="tabAdmin" onclick="switchType('admin')">管理员登录</button>
            </div>

            <form id="loginForm" autocomplete="off">
                <div class="field">
                    <label for="username" id="usernameLabel">姓名</label>
                    <input type="text" id="username" placeholder="请输入姓名" required>
                </div>
                <div class="field">
                    <label for="password" id="passwordLabel">密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn btn-primary login-submit" id="submitBtn">登录</button>
                <div class="hint" style="margin-top:14px;text-align:center;">
                    员工首次登录的初始密码为本人手机号，登录后请尽快修改。
                </div>
            </form>
        </section>
    </div>
</div>

<div class="toast-host" id="toastHost"></div>

<script src="/js/api.js"></script>
<script>
    var loginType = 'employee';

    function switchType(type) {
        loginType = type;
        var isAdmin = type === 'admin';
        document.getElementById('tabEmployee').classList.toggle('active', !isAdmin);
        document.getElementById('tabAdmin').classList.toggle('active', isAdmin);
        document.getElementById('formTitle').textContent = isAdmin ? '管理员登录' : '员工登录';
        document.getElementById('usernameLabel').textContent = isAdmin ? '管理员账号' : '姓名';
        document.getElementById('username').placeholder = isAdmin ? '请输入管理员账号' : '请输入姓名';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
    }

    document.getElementById('loginForm').addEventListener('submit', function (event) {
        event.preventDefault();
        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;
        if (!username) {
            Toast.warning('请输入' + (loginType === 'admin' ? '管理员账号' : '姓名'));
            return;
        }
        if (!password) {
            Toast.warning('请输入密码');
            return;
        }

        var button = document.getElementById('submitBtn');
        button.disabled = true;
        button.textContent = '登录中…';

        Api.post('/api/auth/login', {
            loginType: loginType,
            username: username,
            password: password
        }).then(function (data) {
            if (loginType === 'employee') {
                window.sessionStorage.setItem('employeeId', data.id);
                window.sessionStorage.setItem('employeeName', data.name || '');
                window.location.href = '/pages/employee-center.html';
            } else {
                window.localStorage.setItem('adminName', data.name || '');
                window.localStorage.setItem('adminId', data.id);
                window.location.href = '/index.html';
            }
        }).catch(function (error) {
            Toast.error(error.message || '登录失败');
            button.disabled = false;
            button.textContent = '登录';
        });
    });
</script>
</body>
</html>
