<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工管理系统</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .content {
            padding: 20px;
        }
        .nav-link.active {
            background-color: #0d6efd;
            color: white !important;
        }
        .name {
            margin-right: 10px;
            color: red;
            cursor: pointer; /* 添加光标样式，提示可点击 */
        }
        .tubiao{
            width: 50px;
            height: 50px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <img class="tubiao" src="../imgs/tubiao.png"/>
            <a class="navbar-brand" href="#">员工管理系统</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" onclick="loadContent('department')">部门管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="loadContent('employee')">员工管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="loadContent('notice')">公告管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="loadContent('leave')">请假管理</a>
                    </li>
                    <!-- <li class="nav-item">
                        <a class="nav-link" href="#" onclick="loadContent('performance')">业绩管理</a>
                    </li> -->
                </ul>
                <!-- 占位元素，后续用 JavaScript 填充管理员名称 -->
                <span class="navbar-text name" id="adminName" onclick="showAdminModal()"></span>
                <button class="btn btn-outline-light" onclick="logout()">退出登录</button>
            </div>
        </div>
    </nav>

    <!-- 主要内容区域 -->
    <div class="container-fluid content">
        <div id="content">
            <!-- 这里是动态加载的内容 -->
            <div id="departmentContent">
                <h3>部门管理</h3>
                <div class="card">
                    <div class="card-body">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>部门名称</th>
                                    <th>描述</th>
                                    <th>负责人</th>
                                    <th>创建时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="departmentTableBody">
                                <!-- 部门数据将在这里动态加载 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 管理员模态框 -->
    <div class="modal fade" id="adminModal" tabindex="-1" aria-labelledby="adminModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="adminModalLabel">管理管理员</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <button type="button" class="btn btn-primary w-100 mb-3" onclick="editAdmin()">修改管理员信息</button>
                    <button type="button" class="btn btn-success w-100" onclick="addAdmin()">添加管理员</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 从 localStorage 读取管理员名称
            const adminName = localStorage.getItem('adminName');
            // 判断 adminName 是否为空
            if (!adminName) {
                console.log('localStorage 中未找到管理员名称，跳转至登录页面');
                window.location.href = '/login.html'; // 跳转至登录页面
                return;
            }
            console.log('从 localStorage 获取的管理员名称:', adminName); // 打印获取到的管理员名称
            if (adminName) {
                // 将管理员名称显示在页面上
                document.getElementById('adminName').textContent = adminName;
            } else {
                console.log('localStorage 中未找到管理员名称');
            }
        });

        // 显示管理员模态框
        function showAdminModal() {
            const modal = new bootstrap.Modal(document.getElementById('adminModal'));
            modal.show();
        }

        // 修改管理员信息
        function editAdmin() {
            // 显示修改表单
            const adminId = prompt('请输入要修改的管理员 ID');
            if (adminId) {
                const newUsername = prompt('请输入新的用户名');
                const newPassword = prompt('请输入新的密码');
                if (newUsername && newPassword) {
                    const adminData = {
                        id: adminId,
                        username: newUsername,
                        password: newPassword
                    };
                    fetch('/api/admin/update', {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(adminData)
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.code === 200) {
                            alert('管理员信息修改成功');
                        } else {
                            alert('管理员信息修改失败: ' + data.message);
                        }
                    })
                    .catch(error => {
                        console.error('请求出错:', error);
                        alert('请求出错，请稍后重试');
                    });
                }
            }
        }

        // 添加管理员
        function addAdmin() {
            const newUsername = prompt('请输入新管理员的用户名');
            const newPassword = prompt('请输入新管理员的密码');
            if (newUsername && newPassword) {
                const adminData = {
                    username: newUsername,
                    password: newPassword
                };
                fetch('/api/admin/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(adminData)
                })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        alert('管理员添加成功');
                    } else {
                        alert('管理员添加失败: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('请求出错:', error);
                    alert('请求出错，请稍后重试');
                });
            }
        }

        function logout() {
            // 退出登录逻辑
            localStorage.removeItem('adminName');
            window.location.href = '/login.html'; 
        }
    </script>

    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/department.js"></script>
    <script src="/js/employee.js"></script>
    <script src="/js/notice.js"></script>
    <script src="/js/leave.js"></script>
</body>
</html>
