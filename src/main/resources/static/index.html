<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工管理系统</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .content {
            padding: 20px;
        }
        .nav-link.active {
            background-color: #0d6efd;
            color: white !important;
        }
		.name {
			margin-top: 1%;
			margin-right: 1%;
			color: red;
		}
		.tubiao{
			width: 50px;
			height: 50px;
			margin-left: 10px;
		}
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
			<img class="tubiao" src="../imgs/tubiao.png"/>
            <a class="navbar-brand" href="#">员工管理系统</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" onclick="loadContent('department')">部门管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="loadContent('employee')">员工管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="loadContent('notice')">公告管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="loadContent('leave')">请假管理</a>
                    </li>
					<!-- <li class="nav-item">
					    <a class="nav-link" href="#" onclick="loadContent('performance')">业绩管理</a>
					</li> -->
                </ul>
                <!-- 占位元素，后续用 JavaScript 填充管理员名称 -->
                <span class="navbar-text name" id="adminName"></span>
                <button class="btn btn-outline-light" onclick="logout()">退出登录</button>
            </div>
        </div>
    </nav>

   

    <!-- 主要内容区域 -->
    <div class="container-fluid content">
        <div id="content">
            <!-- 这里是动态加载的内容 -->
            <div id="departmentContent">
                <h3>部门管理</h3>
                <div class="card">
                    <div class="card-body">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>部门名称</th>
                                    <th>描述</th>
                                    <th>负责人</th>
                                    <th>创建时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="departmentTableBody">
                                <!-- 部门数据将在这里动态加载 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 从 localStorage 读取管理员名称
            const adminName = localStorage.getItem('adminName');
            console.log('从 localStorage 获取的管理员名称:', adminName); // 打印获取到的管理员名称
            if (adminName) {
                // 将管理员名称显示在页面上
                document.getElementById('adminName').textContent = adminName;
            } else {
                console.log('localStorage 中未找到管理员名称');
            }
        });
    </script>

    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/department.js"></script>
    <script src="/js/employee.js"></script>
    <script src="/js/notice.js"></script>
    <script src="/js/leave.js"></script>
</body>
</html>
