<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工管理系统</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .content {
            padding: 20px;
        }
        .nav-link.active {
            background-color: #0d6efd;
            color: white !important;
        }
        .name {
            margin-right: 10px;
            color: red;
            cursor: pointer; /* 添加光标样式，提示可点击 */
        }
        .tubiao{
            width: 50px;
            height: 50px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <img class="tubiao" src="../imgs/tubiao.png"/>
            <a class="navbar-brand" href="#">员工管理系统</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" onclick="loadContent('department')">部门管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="loadContent('employee')">员工管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="loadContent('notice')">公告管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="loadContent('leave')">请假管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="loadContent('performance')">业绩工资</a>
                    </li>
                </ul>
                <!-- 占位元素，后续用 JavaScript 填充管理员名称 -->
                <span class="navbar-text name" id="adminName" onclick="showAdminModal()"></span>
                <button class="btn btn-outline-light" onclick="logout()">退出登录</button>
            </div>
        </div>
    </nav>

    <!-- 主要内容区域 -->
    <div class="container-fluid content">
        <div id="content">
            <!-- 这里是动态加载的内容 -->
            <div id="departmentContent">
                <h3>部门管理</h3>
                <div class="card">
                    <div class="card-body">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>部门名称</th>
                                    <th>描述</th>
                                    <th>负责人</th>
                                    <th>创建时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="departmentTableBody">
                                <!-- 部门数据将在这里动态加载 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 管理员模态框 -->
    <div class="modal fade" id="adminModal" tabindex="-1" aria-labelledby="adminModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="adminModalLabel">管理管理员</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="adminForm">
                        <input type="hidden" id="adminId" name="adminId">
                        <div class="mb-3">
                            <label for="username" class="form-label">用户名</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">密码</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="button" class="btn btn-primary w-100" onclick="submitAdminForm()">确定</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 从 localStorage 读取管理员名称
            const adminName = localStorage.getItem('adminName');
            // const adminId = localStorage.getItem('adminId');
            if (!adminName) {
                console.log('localStorage 中未找到管理员名称，跳转至登录页面');
                window.location.href = '/login.html'; 
                return;
            }
            console.log('从 localStorage 获取的管理员名称:', adminName); 
            // comsole.log('从 localStorage 获取的管理员id:', adminId);
            document.getElementById('adminName').textContent = adminName;
        });

        // 显示管理员模态框
        function showAdminModal() {
            const modal = new bootstrap.Modal(document.getElementById('adminModal'));
            // 重置表单
            document.getElementById('adminForm').reset();
            document.getElementById('adminId').value = '';
            modal.show();
        }

        // 准备修改管理员信息
        function prepareEditAdmin() {
            // 调用获取管理员信息接口
            fetch('/api/admin/info')
               .then(response => response.json())
               .then(data => {
                    if (data.code === 200) {
                        const admin = data.data;
                        // 假设返回数据包含 id、username 字段
                        document.getElementById('adminId').value = admin.id;
                        document.getElementById('username').value = admin.username;
                        document.getElementById('password').value = ''; // 通常不显示原密码，让用户重新输入
                    }
                    showAdminModal();
                })
               .catch(error => {
                    console.error('获取管理员信息出错:', error);
                    alert('获取管理员信息出错，请稍后重试');
                });
        }

        // 提交管理员表单
        function submitAdminForm() {
            const adminId = document.getElementById('adminId').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const adminData = {
                id: adminId,
                username: username,
                password: password
            };

            const url = adminId ? '/api/admin/update' : '/api/admin/add';
            const method = adminId ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(adminData)
            })
           .then(response => response.json())
           .then(data => {
                if (data.code === 200) {
                    alert(adminId ? '管理员信息修改成功' : '管理员添加成功');
                    const modal = bootstrap.Modal.getInstance(document.getElementById('adminModal'));
                    modal.hide();
                } else {
                    alert(adminId ? '管理员信息修改失败: ' + data.message : '管理员添加失败: ' + data.message);
                }
            })
           .catch(error => {
                console.error('请求出错:', error);
                alert('请求出错，请稍后重试');
            });
        }

        function logout() {
            localStorage.removeItem('adminName');
            window.location.href = '/login.html'; 
        }
    </script>

    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth-guard.js"></script>
    <script>
        // 管理端页面仅管理员可进入，未登录会自动跳回登录页
        if (window.AuthGuard) {
            AuthGuard.require('admin');
        }
    </script>
    <script src="/js/main.js"></script>
    <script src="/js/department.js"></script>
    <script src="/js/employee.js"></script>
    <script src="/js/notice.js"></script>
    <script src="/js/leave.js"></script>
    <script src="/js/performance.js"></script>
</body>
</html>
