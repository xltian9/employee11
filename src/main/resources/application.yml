# Tomcat配置
server:
  port: 8080
  tomcat:
    uri-encoding: UTF-8

# Spring配置
spring:
  application:
    name: employee-system

  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/employee_db?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  # JSON 序列化：日期统一 yyyy-MM-dd HH:mm:ss（东八区），避免前端拿到 ISO 串后再手工截断
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

  # JPA配置
  jpa:
    database: mysql
    show-sql: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false

  # MVC配置（springfox 3.0.0 只能在 ant 匹配策略下工作）
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# 日志配置
logging:
  level:
    root: INFO
    com.limiti.employee: INFO

# 头像上传目录（应用启动时会自动创建）
file:
  upload:
    dir: D:\Code\employee11-img/
